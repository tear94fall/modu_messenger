# 전 서비스가 공유하는 인프라 설정.
# 시크릿은 config-service 가 {cipher} 를 복호화해 평문으로 내려주므로
# 클라이언트에는 별도 설정이 필요 없다. 복호화 키는 backend/.env 의 ENCRYPT_KEY 다.
# 서비스 간(Feign) 호출 식별 토큰. /api-internal/** 은 이 값이 X-Internal-Token 헤더로
# 와야만 통과한다. 플레이스홀더는 각 서비스 컨테이너의 환경변수로 풀린다 — prod 에서는
# backend/.env 의 INTERNAL_API_TOKEN 에 강한 값을 넣어야 한다.
modu:
  internal-api:
    token: ${INTERNAL_API_TOKEN:modu-internal-dev-token}

  # 백오피스. password-hash 는 bcrypt. 비어 있으면 관리자 로그인이 항상 실패한다.
  admin:
    password-hash: ${ADMIN_PASSWORD_HASH:}
    allowed-origin: ${ADMIN_ALLOWED_ORIGIN:http://localhost:5173}
  oauth:
    # auth-service(발급자)와 gateway(JWKS 검증)가 같이 읽는다. RSA 키는 config-service 가 복호화한다.
    issuer: http://192.168.0.3:8000/auth-service
    jwks-uri: http://auth-service:9900/oauth2/jwks
    access-token-ttl: 1h
    refresh-token-ttl: 7d
    sso-code-ttl: 60s
    google:
      # 앱들이 requestIdToken 에 쓰는 웹 클라이언트 ID(비밀 아님). ID 토큰의 aud 가 이 값이어야 한다.
      audiences: [529862674339-34f6a7he3npv9kkufh8u8ie6mma3f92j.apps.googleusercontent.com]
    rsa:
      private-key: '{cipher}'
      public-key: '{cipher}'
    clients:
      - id: modu-chat
        grants: [google_id_token, refresh_token]
        scopes: [openid, profile, chat]
        sso-issuer: true
      - id: modu-commerce
        grants: [google_id_token, sso_code, refresh_token]
        scopes: [openid, profile, commerce]
      - id: modu-admin
        grants: [admin_password, refresh_token]
        scopes: [openid, admin]

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

spring:
  kafka:
    producer:
      bootstrap-servers: kafka:9092
    consumer:
      bootstrap-servers: kafka:9092
  data:
    redis:
      cluster:
        nodes:
          - redis-node-1:6379
          - redis-node-2:6379
          - redis-node-3:6379
          - redis-node-4:6379
          - redis-node-5:6379
          - redis-node-6:6379
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 30s
  rabbitmq:
    host: rabbitmq
    username: '{cipher}fca9392645c442339c1e59f85f7ba40b9ead2aead8892da8e67e87ef7a0be65d'
    password: '{cipher}fca9392645c442339c1e59f85f7ba40b9ead2aead8892da8e67e87ef7a0be65d'

  datasource:
